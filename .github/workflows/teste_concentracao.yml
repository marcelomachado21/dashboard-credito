name: Teste concentração (amostra)
on:
  push:
    branches: [teste-concentracao]
permissions:
  contents: write
jobs:
  amostra:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Trazer a base de posição publicada
        run: |
          mkdir -p out
          git fetch -q --depth 1 origin dados
          git archive FETCH_HEAD posicao.json | tar -x -C out
      - name: Histórico anual (IF.data, semestres desde dez/20)
        run: python3 -I scripts/atualiza_historico.py raw out
      - name: Gravar a saída no ramo teste-concentracao-saida
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out && rm -f posicao.json
          git init -q -b saida
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Teste: histórico anual"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" saida:refs/heads/teste-concentracao-saida
