name: Teste concentração (amostra)
on:
  push:
    branches: [teste-concentracao]
permissions:
  contents: read
jobs:
  amostra:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python3 -I scripts/amostra_concentracao.py out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amostra
          path: out
          retention-days: 5
