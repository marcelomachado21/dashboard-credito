/* ===== Camada de dados: único ponto a trocar na migração para o GitHub Pages ===== */
const FONTE_DADOS = { base: "./data/" };
async function carregar(nome) {
  const r = await fetch(FONTE_DADOS.base + nome + ".json", { cache: "no-cache" });
  if (!r.ok) throw new Error(`${nome}.json: HTTP ${r.status}`);
  const d = await r.json();
  if (d && d.escopos && typeof registraRecortes === "function") registraRecortes(d.escopos);
  return d;
}

function rosca(titulo, itens) {        // itens: [{ nm, v, p }] já na ordem fixa; "outros" por último em cinza

  let a0 = -Math.PI / 2, g = "", k = 0;

function notas() {

    <p><b>Fonte.</b> Microdados de operações da <a href="${esc(m.url)}" target="_blank" rel="noopener">Matriz de Dados do Crédito Rural (SICOR)</a>, Banco Central. Arquivo do ano corrente publicado em ${esc(new Date(m.arquivo_last_modified).toLocaleDateString("pt-BR"))}, com operações emitidas até ${dmy(m.ref)}. Cadastro: ${esc(m.cadastro)}.</p>
    <p><b>Safra.</b> Julho a junho. O valor é o contratado na emissão (VL_PARC_CREDITO), sem CPR e sem títulos do agro. "Mesmo ponto" compara emissões até ${dmy(m.ref)} com emissões até ${dmy(m.ref_anterior)}.</p>
    <p><b>Meses em consolidação.</b> O SICOR recebe registros com atraso. Em setembro, relatório da Faesp com dados do BC somava R$ 44,3 bi em jul–ago/26; o arquivo de outubro já soma ${brl((ser("sfn","BR",s)[0].slice(0,4).reduce((a,b)=>a+b,0)+ser("sfn","BR",s)[1].slice(0,4).reduce((a,b)=>a+b,0)))} para os mesmos meses. Por isso, os dois últimos meses aparecem hachurados e a queda da safra corrente tende a diminuir nas próximas atualizações. Para jul–ago/25 os dois números batem (R$ 71,3 bi e ${brl(ser("sfn","BR",s-1)[0].slice(0,4).reduce((a,b)=>a+b,0)+ser("sfn","BR",s-1)[1].slice(0,4).reduce((a,b)=>a+b,0))}).</p>
    <p><b>Local.</b> Brasil ou o estado escolhido, pelo estado da operação (local do empreendimento), não pela sede da instituição. Os recortes de cada estado (Cooperativas, Sicoob, Sicredi e solteiras) usam a UF da sede da cooperativa no cadastro do BC: Sicoob SP reúne singulares Sicoob com sede em SP, onde quer que a operação esteja. Central Crediminas e Central Cecremge reúnem as singulares filiadas a cada central na relação atual do BC.</p>
    <p><b>Escopos.</b> Cooperativas = singulares e centrais; Banco Sicoob e Banco Sicredi ficam em "Bancos". Nesta aba, "Bancos" reúne todas as instituições que não são cooperativas (bancos, agências de fomento e demais). Sistemas pelo nome da central de filiação no cadastro do BC (Sicoob, Sicredi, Cresol, Unicred, Ailos, Credisis, Uniprime); solteiras são singulares sem central. Conglomerado Sicoob e Conglomerado Sicredi somam cooperativas, centrais e o banco cooperativo do sistema. No ranking por conglomerado, os bancos seguem o conglomerado prudencial do IF.data (ex.: Banco John Deere entra no conglomerado Bradesco). Bancos digitais seguem a lista fixa do projeto; nesta safra operam no rural: ${esc((m.digitais_com_operacao || []).join(", "))}. Unicred não registra operações rurais no período.</p>
    <p><b>Nomes.</b> Número e nome das cooperativas Sicoob pela <a href="https://www.sicoob.com.br/documents/128035770/192856421/Lista_dos_DPO-Cooperativa-Central-CCS.pdf" target="_blank" rel="noopener">lista oficial do Sicoob</a> (encarregados de dados, com CNPJ), cruzada com a relação de instituições do BC. Na lista, Ascicred (4034) e Vale do Aço (4036) aparecem com CNPJ de outras cooperativas; o número foi associado pelo nome. Demais cooperativas pelo nome da razão social. Razão social completa aparece abaixo do nome no ranking.</p>
    <p><b>Incorporações.</b> Operações de cooperativa ou banco incorporado entram na incorporadora em todo o histórico, para comparar bases iguais (${D.meta.incorporacoes_aplicadas} instituições nesta base). Fonte principal: quadro mensal de autorizações e alterações societárias do BC (Evolução do SFN). Para incorporações de 2026 ainda fora do quadro, atos e notícias das próprias cooperativas: Vale do Cerrado na Sicredi Celeiro Centro Norte, União MT/MS no Sicoob Primavera (4345) e Credimota no Sicoob Crediceripa (3197). Sicredi Pantanal MS foi dividida entre duas cooperativas e fica com o próprio nome. Cresol Xanxerê e Cresol Áurea saíram da relação do BC sem fonte pública sobre a incorporadora; ficam com o próprio nome.</p>

function tsChart(lines, o = {}) {
  const id = "g" + (++cid), W = 640, H = o.h || 240, L = 46, R2 = 104, T = 14, B = 26;
  const xs = [...new Set(lines.flatMap(l => l.pts.map(p => p.d)))].sort();
  const vals = lines.flatMap(l => l.pts.map(p => p.v)).filter(v => v != null);
  if (!vals.length) return `<p class="empty">Sem dado neste recorte.</p>`;
  const tk = ticks(o.zero ? Math.min(0, ...vals) : Math.min(...vals), Math.max(...vals));
  const mn = tk[0], mx = tk[tk.length - 1];
  const X = (d) => L + (xs.length < 2 ? 0 : xs.indexOf(d) * (W - L - R2) / (xs.length - 1)), Y = (v) => T + (H - T - B) * (1 - (v - mn) / (mx - mn || 1));
  const fmt = o.fmt || (v => nf(v, 1));
  let g = tk.map(t => `<line class="grid" x1="${L}" x2="${W - R2}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${fmt(t)}</text>`).join("");
  const step = Math.max(1, Math.ceil(xs.length / 7));
  const lbX = o.daily ? (d) => d.slice(8, 10) + "/" + ym(d) : ym;
  xs.forEach((d, i) => { if ((xs.length - 1 - i) % step === 0) g += `<text x="${X(d)}" y="${H - 6}" text-anchor="middle">${o.daily ? ym(d) : ym(d)}</text>`; });
  const ends = [];
  lines.forEach(l => {
    const pp = l.pts.filter(p => p.v != null); if (!pp.length) return;
    g += `<path d="${pp.map((p, i) => `${i ? "L" : "M"}${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join("")}" fill="none" stroke="${l.c}" stroke-width="${l.w || 2}" stroke-linejoin="round" stroke-linecap="round"${l.dash ? ` stroke-dasharray="${l.dash}"` : ""}/>`;
    if (o.dots) pp.forEach(p => { g += `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="2.5" fill="${l.c}"/>`; });
    const e = pp[pp.length - 1]; ends.push({ x: X(e.d), y: Y(e.v), v: e.v, c: l.c, name: l.name, strong: (l.w || 2) > 2 });
  });
  ends.sort((a, b) => a.y - b.y);
  ends.forEach((e, i) => { e.ly = i && e.y - ends[i - 1].ly < 24 ? ends[i - 1].ly + 24 : e.y; });
  ends.forEach(e => { g += `<circle cx="${e.x}" cy="${e.y}" r="${e.strong ? 4 : 3}" fill="${e.c}" stroke="var(--bg)" stroke-width="2"/><text x="${W - R2 + 8}" y="${e.ly - 1}" class="${e.strong ? "lbl-strong" : ""}">${esc(e.name)}</text><text x="${W - R2 + 8}" y="${e.ly + 11}" class="${e.strong ? "lbl-strong" : ""}">${fmt(e.v)}${o.unit || ""}</text>`; });
  g += `<line id="${id}x" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--faint)" visibility="hidden"/>`;
  setTimeout(() => {
    const svg = document.getElementById(id); if (!svg) return;
    const ln = document.getElementById(id + "x"), r = document.getElementById(id + "r");
    const mv = (ev) => { const b = svg.getBoundingClientRect(), px = (ev.clientX - b.left) / b.width * W;
      let best = xs[0], bd = 1e9; xs.forEach(d => { const dd = Math.abs(X(d) - px); if (dd < bd) { bd = dd; best = d; } });
      ln.setAttribute("x1", X(best)); ln.setAttribute("x2", X(best)); ln.setAttribute("visibility", "visible");
      r.innerHTML = `<b>${lbX(best)}</b> · ` + lines.map(l => { const p = l.pts.find(q => q.d === best); return p && p.v != null ? `<span style="color:${l.c}">${esc(l.name)}: ${fmt(p.v)}${o.unit || ""}</span>` : ""; }).filter(Boolean).join(" · "); };
    svg.addEventListener("pointermove", mv); svg.addEventListener("pointerdown", mv);
  }, 0);
  return `<svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "série")}">${g}</svg><div class="readout" id="${id}r">Passe o dedo ou o mouse no gráfico para ver os valores.</div>`;
}
function scatterLin(pts, o = {}) {
  const W = 640, H = o.h || 300, L = 46, R2 = 18, T = 14, B = 34;
  if (!pts.length) return `<p class="empty">Sem instituições neste recorte.</p>`;
  const tx = ticks(0, Math.max(...pts.map(p => p.x)) * 1.05), ty = ticks(Math.min(...pts.map(p => p.y)) * 0.95, Math.max(...pts.map(p => p.y)) * 1.03);
  const X = (v) => L + (W - L - R2) * (v - tx[0]) / (tx[tx.length - 1] - tx[0]), Y = (v) => T + (H - T - B) * (1 - (v - ty[0]) / (ty[ty.length - 1] - ty[0]));
  let g = ty.map(t => `<line class="grid" x1="${L}" x2="${W - R2}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${nf(t, 0)}%</text>`).join("");
  g += tx.map(t => `<line class="grid" x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${H - B}"/><text x="${X(t)}" y="${H - 16}" text-anchor="middle">${nf(t, 0)}%</text>`).join("");
  g += `<text x="${(L + W - R2) / 2}" y="${H - 2}" text-anchor="middle">${esc(o.xlab || "")}</text>`;
  if (o.yref) g += `<line x1="${L}" x2="${W - R2}" y1="${Y(o.yref)}" y2="${Y(o.yref)}" stroke="var(--down)" stroke-dasharray="4 4"/><text x="${W - R2}" y="${Y(o.yref) - 5}" text-anchor="end" style="fill:var(--down)">${esc(o.yrefLabel || "")}</text>`;
  pts.forEach(p => { g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.lbl ? 5.5 : 4}" fill="${p.c}" fill-opacity="${p.lbl ? 0.95 : 0.5}" stroke="var(--bg)" stroke-width="1.5"><title>${esc(p.name)}: ${esc(o.xn || "x")} ${nf(p.x, 2)}% · ${esc(o.yn || "y")} ${nf(p.y, 1)}%</title></circle>`; });
  pts.filter(p => p.lbl).forEach(p => { g += `<text x="${X(p.x) + 8}" y="${Y(p.y) + 4}" class="lbl-strong">${esc(p.name)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "dispersão")}">${g}</svg>`;
}
