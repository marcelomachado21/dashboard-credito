name: Atualizar dados do Banco Central
on:
  schedule:
    - cron: "22 7 * * 1"        # segunda-feira, 4h22 em Brasília (07h22 UTC)
  workflow_dispatch:
    inputs:
      forcar:
        description: "Reprocessar todas as bases (ignora a checagem de mudança)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/atualiza.yml"]   # mudança nos scripts: reprocessa tudo para testar
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: atualiza
  cancel-in-progress: false
jobs:
  atualiza:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Verificar e atualizar as bases
        env:
          RAW_DIR: ${{ runner.temp }}/raw
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.forcar }}" = "true" ]; then
            python3 -I scripts/atualiza_tudo.py --forcar
          else
            python3 -I scripts/atualiza_tudo.py
          fi
      - name: Gravar os dados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet && exit 0
          git commit -m "Dados: verificação de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
  publica:
    needs: atualiza
    uses: ./.github/workflows/pages.yml
