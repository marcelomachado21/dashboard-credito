<style>
/* Layout: painel analítico em coluna — filtros fixos no topo, indicadores em faixa, gráficos e tabelas em grade de duas colunas que vira uma no celular. */
:root {

  --panel: #f6f7f7;
  --ink: #1d2124;
  --muted: #646b70;
  --faint: #9aa1a6;

  --grafite: #2b2f33;

  --accent: #00ae9d;
  --accent-ink: #00786c;
  --up: #1b7a3e;
  --down: #b42318;
  --warn-bg: #fff6e0;
  --warn-ink: #7a4b00;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121516; --panel: #1a1e20; --ink: #e6e9eb; --muted: #a2a9ae; --faint: #6f777c; --line: #2a3033;
    --grafite: #d4d8db; --grafite-2: #7f878d; --accent: #2fc4b4; --accent-ink: #5dd6c8; --up: #5cc47e; --down: #ff7b6e;
    --warn-bg: #352a12; --warn-ink: #f2c879; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121516; --panel: #1a1e20; --ink: #e6e9eb; --muted: #a2a9ae; --faint: #6f777c; --line: #2a3033;
  --grafite: #d4d8db; --grafite-2: #7f878d; --accent: #2fc4b4; --accent-ink: #5dd6c8; --up: #5cc47e; --down: #ff7b6e;
  --warn-bg: #352a12; --warn-ink: #f2c879; color-scheme: dark;
}
* { box-sizing: border-box; }

main .wrap { padding-block: 18px 48px; display: grid; gap: 26px; }
h2 { font-family: var(--f-display); font-stretch: 82%; font-weight: 700; font-size: 1.3rem; margin: 0; text-wrap: balance; }
h3 { font-family: var(--f-display); font-stretch: 88%; font-weight: 700; font-size: 1rem; margin: 0; text-wrap: balance; }
.eyebrow { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

.badge-new { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-ink); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; line-height: 1.5; vertical-align: 2px; }

.meta a { color: var(--muted); }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
th { text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; white-space: nowrap; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
th.num { font-family: var(--f-body); }
td small { display: block; color: var(--faint); font-size: 0.7rem; font-family: var(--f-body); }
tr.sub td { color: var(--muted); }
tr.tot td { font-weight: 600; border-top: 1px solid var(--ink); }
td.part { color: var(--faint); font-style: italic; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 0; flex: none; }
.bar-cell { position: relative; width: 32%; min-width: 70px; }
.bar-cell .b { position: absolute; left: 8px; top: 50%; height: 8px; transform: translateY(-50%); border-radius: 0 4px 4px 0; opacity: 0.9; }
.bar-cell .b.prev { height: 2px; background: var(--faint) !important; top: calc(50% + 7px); }
.rank-tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.sel { font: inherit; font-size: 0.82rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; max-width: 100%; }
.rank-tools input { font: inherit; font-size: 0.84rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; width: min(100%, 240px); }
.linkbtn { font: inherit; font-size: 0.82rem; color: var(--accent-ink); background: none; border: 0; padding: 4px 0; cursor: pointer; font-weight: 600; }
.ficha-link { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--faint); }
.ficha-link:hover { color: var(--accent-ink); border-bottom-color: currentColor; }
.big { font-family: var(--f-display); font-stretch: 78%; font-weight: 700; font-size: 1.6rem; line-height: 1.05; display: block; font-variant-numeric: tabular-nums; }
.pair { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; }
.pair > div { display: grid; gap: 2px; }
ol.hl { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 0.9rem; }
.tabcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.tabcard { display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink); }
.tabcard:hover { border-color: var(--accent); }
.tabcard span { font-size: 0.8rem; color: var(--muted); }
.inst-name { display: flex; align-items: center; min-width: 0; }
.inst-name span { min-width: 0; }
.tag { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; white-space: nowrap; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.methods { font-size: 0.84rem; color: var(--muted); display: grid; gap: 6px; max-width: 86ch; }
.methods p { margin: 0; }
.methods a { color: var(--accent-ink); }
.methods b { color: var(--ink); font-weight: 600; }

@media (max-width: 700px) { .filters { position: static; } .flabel { width: 100%; } }
@media (max-width: 520px) { .kpi + .kpi { border-left: 0; padding-left: 0; } .kpis { grid-template-columns: 1fr 1fr; } .kpi:nth-child(even) { padding-left: 12px; border-left: 1px solid var(--line); } .kpi .val { font-size: 1.6rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

<script>
/* ===== Camada de dados: único ponto a trocar na migração para o GitHub Pages ===== */
const FONTE_DADOS = { base: "./data/" };
async function carregar(nome) {
  const r = await fetch(FONTE_DADOS.base + nome + ".json", { cache: "no-cache" });
  if (!r.ok) throw new Error(`${nome}.json: HTTP ${r.status}`);
  return r.json();
}

(() => {
const ABAS = ["Visão geral","Carteira","Qualidade e risco","Resultados","Crédito rural","Safra (SICOR)","Rankings","Mapa de posicionamento","Ficha da instituição","Fontes e metodologia"];
const MES = ["jul","ago","set","out","nov","dez","jan","fev","mar","abr","mai","jun"];
const MESF = ["julho","agosto","setembro","outubro","novembro","dezembro","janeiro","fevereiro","março","abril","maio","junho"];
const FIN = [["all","Todas"],["c","Custeio"],["i","Investimento"],["m","Comercialização"],["n","Industrialização"]];
const FIDX = { c: 0, i: 1, m: 2, n: 3 };
const GRUPOS = [["agregado","Agregados"],["conglomerado","Conglomerados"],["sistema","Cooperativas por sistema"],["mg","Minas"],["banco","Bancos"]];
const PROG = { pronaf: "Pronaf", pronamp: "Pronamp", sem_programa: "Sem programa (demais)", outros: "Outros programas" };
const FONTE = { obrig: "Obrigatórios (MCR 6.2)", lca_eq: "LCA equalizada", lca: "LCA não controlada", poup_eq: "Poupança rural equalizada", poup_livre: "Poupança rural não controlada",
  bndes_eq: "BNDES equalizado", bndes: "BNDES não equalizado", fundos: "Fundos constitucionais", funcafe: "Funcafé", livres_eq: "Recursos livres equalizados", livres: "Recursos livres", tesouro: "Tesouro Nacional", outras: "Outras fontes" };
const PORTE = { pequeno: "Pequeno produtor", medio: "Médio produtor", grande: "Grande produtor", outros: "Outras categorias" };
const DARKMAP = { "#2B2F33": "#D4D8DB", "#003641": "#3FA7B5", "#007A6E": "#2FC4B4" };

let D = null;
const st = { safra: 0, esc: "sfn", geo: "BR", fin: "all", rkTipo: "todos", rkAll: false, rkBusca: "", rkOrd: "a", rkVer: "cong" };
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = (v, d = 1) => v == null || !isFinite(v) ? "—" : Number(v).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const isDark = () => css("--bg").toLowerCase() !== "#ffffff";
const cor = (hex) => isDark() && DARKMAP[hex.toUpperCase()] ? DARKMAP[hex.toUpperCase()] : hex;
const safraLbl = (s) => `${s - 1}/${String(s).slice(2)}`;
const dmy = (iso) => { const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; };
const brl = (mi, dec) => mi >= 1000 ? `R$ ${nf(mi / 1000, dec ?? (mi >= 100000 ? 0 : 1))} bi` : `R$ ${nf(mi, dec ?? 0)} mi`;
const pct = (a, p) => p ? (a / p - 1) * 100 : null;
const sgn = (v, d = 1, suf = "%") => v == null || !isFinite(v) ? "—" : `${v > 0 ? "+" : ""}${nf(v, d)}${suf}`;
const cls = (v) => v == null ? "flat" : v > 0.05 ? "up" : v < -0.05 ? "down" : "flat";
const arrow = (v) => v == null ? "" : v > 0.05 ? "▲ " : v < -0.05 ? "▼ " : "= ";
const val = (row) => st.fin === "all" ? row[0] + row[1] + row[2] + row[3] : row[FIDX[st.fin]];
const escopo = (id) => D.escopos.find(e => e.id === id);
const finNome = () => FIN.find(f => f[0] === st.fin)[1];
const geoNome = () => st.geo === "BR" ? "Brasil" : "Minas Gerais";

/* ---------- derivados ---------- */
const SA = () => D.meta.safra_atual;
const S = () => st.safra || SA();
const cur = () => S() === SA();
const refTxt = () => cur() ? `até ${dmy(D.meta.ref)}` : `safra fechada, jul/${String(S() - 1).slice(2)} a jun/${String(S()).slice(2)}`;
const pontoTxt = () => cur() ? `mesmo ponto de ${safraLbl(S() - 1)}` : `safra ${safraLbl(S() - 1)} fechada`;
const kRef = () => cur() ? (+D.meta.ref.slice(5, 7) - 7 + 12) % 12 : 11;            // índice do último mês com dado
const consolida = () => cur() ? [kRef(), kRef() - 1].filter(k => k >= 0) : [];      // meses ainda recebendo registros
const comp = (id = st.esc, geo = st.geo) => D.comp[String(S())]?.[id]?.[geo];
function IG(i, geo) {
  if (i._v) return i._v[geo];
  const s = S(), x = i[geo]?.[s]; if (!x) return null;
  const prev = i[geo]?.[s - 1];
  return { a: x.a, p: x.p, q: x.q, t: prev ? sum4(prev.a) : (cur() ? 0 : x.p) };
}
const ser = (id, geo, s) => D.serie[id]?.[geo]?.[String(s)];
const novo = () => (Date.now() - new Date(D.meta.novo_desde + "T12:00:00")) / 864e5 <= 7;

function instEscopos(i) {
  const s = ["sfn", i.tipo === "coop" ? "coop" : "bancos"];
  if (i.cong === "sicoob" || i.cong === "sicredi") s.push("cong_" + i.cong);
  if (i.tipo === "coop") { s.push(i.sistema || "outras"); if (i.sistema === "sicoob" && i.uf === "MG") s.push("sicoob_mg"); if (i.central) s.push(i.central); }
  const top = { "00000000": "bb", "60746948": "bradesco", "60701190": "itau", "00360305": "caixa", "90400888": "santander" };
  if (top[i.cnpj]) s.push(top[i.cnpj]);
  if (i.tipo !== "coop" && (D.meta.digitais_com_operacao || []).includes(i.curto)) s.push("digitais");
  return s;
}
function instCor(i) {
  const top = { "00000000": "bb", "60746948": "bradesco", "60701190": "itau", "00360305": "caixa", "90400888": "santander" };
  if (top[i.cnpj]) return cor(escopo(top[i.cnpj]).cor);
  if (i.cong === "sicoob" || i.cong === "sicredi") return cor(escopo("cong_" + i.cong).cor);
  if (i.tipo === "coop") return cor(escopo(i.sistema || "outras").cor);
  if ((D.meta.digitais_com_operacao || []).includes(i.curto)) return cor(escopo("digitais").cor);
  return css("--grafite-2");
}

/* ---------- gráficos ---------- */
function ticks(min, max, n = 4) {
  const span = max - min || Math.abs(max) || 1, s0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(s0)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= s0);
  const out = []; for (let v = Math.floor(min / step) * step; v <= Math.ceil(max / step) * step + step / 2; v += step) out.push(+v.toFixed(8));
  return out;
}
let cid = 0;
function lineChart(lines, o = {}) {
  const id = "g" + (++cid), W = 640, H = o.h || 250, L = 52, R = 92, T = 14, B = 26, n = 12;
  const vals = lines.flatMap(l => l.v.filter(x => x != null));
  const tk = ticks(Math.min(0, ...vals), Math.max(...vals, 1));
  const mn = tk[0], mx = tk[tk.length - 1];
  const X = (i) => L + i * (W - L - R) / (n - 1), Y = (v) => T + (H - T - B) * (1 - (v - mn) / (mx - mn || 1));
  const fmt = o.fmt || (v => nf(v, 0));
  let g = tk.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${fmt(t)}</text>`).join("");
  MES.forEach((m, i) => { g += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${m}</text>`; });
  if (o.shade) o.shade.forEach(k => { g += `<rect x="${X(k) - (W - L - R) / (n - 1) / 2}" y="${T}" width="${(W - L - R) / (n - 1)}" height="${H - T - B}" fill="var(--warn-bg)" opacity="0.7"/>`; });
  const ends = [];
  lines.forEach(l => {
    let d = "", pen = false;
    l.v.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; });
    g += `<path d="${d}" fill="none" stroke="${l.c}" stroke-width="${l.w || 2}" stroke-linejoin="round" stroke-linecap="round"${l.dash ? ` stroke-dasharray="${l.dash}"` : ""}/>`;
    const li = l.v.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
    if (li != null && li >= 0) ends.push({ x: X(li), y: Y(l.v[li]), v: l.v[li], c: l.c, name: l.name, strong: l.w > 2 });
  });
  ends.sort((a, b) => a.y - b.y);
  ends.forEach((e, i) => { e.ly = i && e.y - ends[i - 1].ly < 24 ? ends[i - 1].ly + 24 : e.y; });
  ends.forEach(e => {

function tsChart(lines, o = {}) {

  const xs = [...new Set(lines.flatMap(l => l.pts.map(p => p.d)))].sort();
  const vals = lines.flatMap(l => l.pts.map(p => p.v)).filter(v => v != null);
  if (!vals.length) return `<p class="empty">Sem dado neste recorte.</p>`;

  const mn = tk[0], mx = tk[tk.length - 1];
  const X = (d) => L + (xs.length < 2 ? 0 : xs.indexOf(d) * (W - L - R2) / (xs.length - 1)), Y = (v) => T + (H - T - B) * (1 - (v - mn) / (mx - mn || 1));

  const step = Math.max(1, Math.ceil(xs.length / 7));
  xs.forEach((d, i) => { if ((xs.length - 1 - i) % step === 0) g += `<text x="${X(d)}" y="${H - 6}" text-anchor="middle">${ym(d)}</text>`; });
  const ends = [];
  lines.forEach(l => {
    const pp = l.pts.filter(p => p.v != null); if (!pp.length) return;
    g += `<path d="${pp.map((p, i) => `${i ? "L" : "M"}${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join("")}" fill="none" stroke="${l.c}" stroke-width="${l.w || 2}" stroke-linejoin="round" stroke-linecap="round"${l.dash ? ` stroke-dasharray="${l.dash}"` : ""}/>`;
    if (o.dots) pp.forEach(p => { g += `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="2.5" fill="${l.c}"/>`; });
    const e = pp[pp.length - 1]; ends.push({ x: X(e.d), y: Y(e.v), v: e.v, c: l.c, name: l.name, strong: (l.w || 2) > 2 });

function stackStages(pts, o = {}) {                 // barras empilhadas: estágio 2 e 3 (e simplificada problemática)

      g += `<rect x="${x}" y="${y0 - h}" width="${bw}" height="${Math.max(0, h - 1)}" fill="${c}" opacity="0.85"><title>${ym(p.d)} · ${n}: ${nf(v, 2)}%</title></rect>`; y0 -= h; });

  });

function scatterLin(pts, o = {}) {

  $("#view").innerHTML = `<div><div class="eyebrow">Referência</div><h2>Fontes e metodologia</h2><p class="lede">Todas as bases são públicas e do Banco Central, salvo a lista de cooperativas do Sicoob. Nada interno de cooperativas ou centrais entra no painel.</p></div>
    ${block("Bases", "Data de referência atual de cada uma", `<div class="tbl-wrap"><table><thead><tr><th>Base</th><th>Abas</th><th>Conteúdo</th><th>Frequência</th><th>Defasagem</th><th>Referência</th></tr></thead><tbody>${B.map(([n, a, c, f, d, r, u]) => `<tr><td><a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a></td><td><small>${esc(a)}</small></td><td>${esc(c)}</td><td>${esc(f)}</td><td>${esc(d)}</td><td class="num">${esc(r)}</td></tr>`).join("")}</tbody></table></div>`)}
    <div class="grid2">${block("Escopos", "Como cada grupo é formado", `<div class="tbl-wrap"><table><tbody>${ESC.map(([a, b]) => `<tr><td><b>${esc(a)}</b></td><td>${esc(b)}</td></tr>`).join("")}</tbody></table></div>`)}
      ${block("Regras do painel", "", `<div class="tbl-wrap"><table><tbody>${RG.map(([a, b]) => `<tr><td><b>${esc(a)}</b></td><td>${esc(b)}</td></tr>`).join("")}</tbody></table></div>`)}</div>
    ${block("Indicadores", "Definição usada no painel", `<div class="tbl-wrap"><table><thead><tr><th>Indicador</th><th>Definição</th><th>Melhor quando</th></tr></thead><tbody>${P.metricas.map(m => `<tr><td><b>${esc(m.nome)}</b></td><td>${esc(m.desc)}</td><td>${({ alto: "maior", baixo: "menor", neutro: "sem direção" })[m.melhor]}</td></tr>`).join("")}
      <tr><td><b>Concessões 12 meses a/a</b></td><td>Soma das concessões dos últimos 12 meses sobre a soma dos 12 meses anteriores (SGS), nominal.</td><td>—</td></tr>

  carregar("status").then(blocoStatus).catch(() => {});

function blocoStatus(st) {
  const el = $("#stbox"); if (!el || !st || !st.bases) return;
  const nm = { safra: "Safra (SICOR)", risco: "Qualidade e risco", posicao: "Posicionamento (IF.data)", resultados: "Resultados (balancetes)", carteira: "Carteira (SGS e Cosif)" };
  const rf = (r) => r == null ? "—" : typeof r === "object" ? Object.entries(r).map(([k, v]) => `${k} ${String(v).length === 7 ? ym(v) : dmy(v)}`).join(" · ") : String(r).length === 7 ? ym(r) : dmy(r);
  const cl = { "atualizado": "up", "sem mudança": "flat", "falhou": "down", "reprovado": "down" };
  const quando = new Date(st.verificado_em).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short", timeZone: "America/Sao_Paulo" });
  el.innerHTML = block("Última verificação automática", `${quando} · ${st.ultima_atualizacao ? "última atualização de dados em " + dmy(st.ultima_atualizacao) : ""}`,
    `<div class="tbl-wrap"><table><thead><tr><th>Arquivo</th><th>Situação</th><th>Referência publicada</th><th>Observação</th></tr></thead><tbody>${Object.entries(st.bases).map(([k, b]) =>
      `<tr><td>${esc(nm[k] || k)}</td><td><span class="${cl[b.situacao] || "flat"}">${esc(b.situacao)}</span></td><td>${esc(rf(b.ref))}</td><td><small>${esc(b.motivo || "")}</small></td></tr>`).join("")}</tbody></table></div>`,
    `"Falhou" ou "reprovado": a base seguiu com o último dado válido. Registro completo na aba Actions do repositório.`);
}

const aba = () => { const h = location.hash.slice(1); return h.startsWith("ficha") ? "ficha" : Object.values(ABA_ID).includes(h) ? h : "visao"; };
function render() {
  $("#tabs").innerHTML = ABAS.map((a, i) => `<a href="#${ABA_ID[i]}"${aba() === ABA_ID[i] ? ' aria-current="page"' : ""}>${a}</a>`).join("");
  ({ visao: renderVisao, carteira: renderCarteira, risco: renderRisco, resultados: renderRes, rural: renderRural, safra: renderSafra, rankings: renderRankings, posicao: renderPos, ficha: renderFicha, fontes: renderFontes })[aba()]();
}
addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
try { Object.assign(st, JSON.parse(localStorage.getItem("safra-filtros") || "{}")); } catch (e) {}

try { Object.assign(rus, JSON.parse(localStorage.getItem("rural-filtros") || "{}")); } catch (e) {}
try { Object.assign(rks, JSON.parse(localStorage.getItem("rank-filtros") || "{}")); } catch (e) {}

})();
