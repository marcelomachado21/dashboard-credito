name: Teste concentração (amostra)
on:
  push:
    branches: [teste-concentracao]
permissions:
  contents: write
jobs:
  amostra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sonda do histórico anual (IF.data) e de cooperados
        run: python3 -I scripts/sonda_historico.py out
      - name: Gravar a saída no ramo teste-concentracao-saida
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b saida
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Teste: sonda do histórico anual"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" saida:refs/heads/teste-concentracao-saida
